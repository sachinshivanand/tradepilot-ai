[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepilot-ai"
version = "0.1.0"
description = "AI-powered trading assistant for the Indian stock market"
readme = "../README.md"
requires-python = ">=3.13"

authors = [
    { name = "Sachin Shivanand" }
]

dependencies = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.49",
    "sqlalchemy>=2.0",
    "alembic>=1.18",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
